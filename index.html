<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Lagoon Open — 3D Pier Tennis</title>
</head>
<body>
<div id="stage">
  <canvas id="court" aria-label="Lagoon Open 3D Tennis Court"></canvas>

  <div id="bootLoader" class="chip">
    <div class="boot-badge">TROPICAL PIER CIRCUIT</div>
    <div class="boot-title">Lagoon Open</div>
    <div class="boot-sub" id="bootStatus">Loading 3D pier assets…</div>
    <div class="boot-bar"><div class="boot-fill" id="bootFill"></div></div>
  </div>

  <div id="score" class="chip broadcast-score" aria-live="polite" hidden>
    <div class="bs-accent" id="bsAccent"></div>
    <div class="bs-grid">
      <span></span><span class="bs-venue" id="bsVenueLbl">LAGOON PIER</span><span class="hdr">SET</span><span class="hdr">PTS</span>
      <span class="dot" id="srv0"></span><span class="nm"><span id="youNameHud">You</span><span class="tag" id="modeTagHud" hidden>2V2</span></span><span class="g" id="g0">0</span><span class="p" id="p0">0</span>
      <span class="dot" id="srv1"></span><span class="nm"><span id="oppNameHud">Reef</span><span class="tag" id="oppTierHud">PRO</span></span><span class="g" id="g1">0</span><span class="p" id="p1">0</span>
    </div>
    <div id="scoreBadge" hidden></div>
  </div>

  <div id="trainHud" class="chip" hidden aria-live="polite">
    <div class="blk"><span class="lbl" id="trScoreLbl">Score</span><span class="val sun" id="trScore">0</span></div>
    <div class="blk"><span class="lbl" id="trComboLbl">Combo</span><span class="val cyan" id="trCombo">×1.0</span></div>
    <div class="blk"><span class="lbl" id="trTimeLbl">Time</span><span class="val" id="trTime">60.0</span></div>
    <div class="blk"><span class="lbl">Best</span><span class="val" id="trBest">0</span></div>
  </div>

  <div id="telemetry">
    <div id="speedPill" class="chip pill"><span class="v" id="speedVal">0</span><span class="u">MPH</span></div>
    <div id="rallyPill" class="chip pill"><span class="u">RALLY</span><span class="v" id="rallyVal">0</span></div>
    <div id="lobBadge" class="chip pill">LOB ARMED</div>
    <div id="pingPill" class="chip pill" hidden><span class="v" id="pingVal">--</span><span class="u">ms</span></div>
  </div>

  <div id="tools" class="tool-dock chip">
    <div id="fpsTag" class="tool-fps" hidden>60 FPS</div>
    <button class="tbtn" id="wiiBtn" type="button" title="Connect Wii Remote via WebHID"><span class="led" id="wiiLed"></span><span class="lbl" id="wiiLbl">Wii Remote</span></button>
    <button class="tbtn" id="gpBtn" type="button" title="Gamepad status" hidden><span class="led on"></span><span class="lbl" id="gpLbl">Gamepad</span></button>
    <span class="tsep"></span>
    <button class="tbtn" id="skyBtn" type="button" title="Cycle lighting preset">
      <svg class="tico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      <span class="lbl" id="skyLbl">Auto</span>
    </button>
    <button class="tbtn" id="qualBtn" type="button" title="Graphics quality">
      <svg class="tico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      <span class="lbl" id="qualLbl">Ultra</span>
    </button>
    <button class="tbtn" id="sndBtn" type="button" aria-pressed="true" title="Toggle audio">
      <svg class="tico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
      <span class="lbl" id="sndLbl">Sound</span>
    </button>
    <button class="tbtn" id="settingsBtn" type="button" title="Settings & Controls">
      <svg class="tico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.85 1 1.51 1H21a2 2 0 0 1 0 4h-.09c-.66 0-1.25.4-1.51 1z"/></svg>
      <span class="lbl">Settings</span>
    </button>
    <button class="tbtn tbtn-menu" id="menuBtn" type="button" title="Pause / Menu (Esc)" hidden>
      <svg class="tico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="8" y1="6" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="18"/></svg>
      <span class="lbl">Pause</span>
    </button>
  </div>

  <div id="replayBanner" class="chip" hidden>
    <span class="rec-dot"></span>
    <span id="replayLabel">INSTANT REPLAY</span>
    <span class="replay-skip">Click or press any key to skip</span>
  </div>

  <div id="hawkeyeBanner" class="chip" hidden>
    <span class="he-tag">HAWK-EYE</span>
    <span class="he-verdict" id="hawkeyeVerdict">IN</span>
    <span class="he-dist" id="hawkeyeDist">2.4 cm</span>
  </div>

  <div id="msg"><div class="big" id="msgBig"></div><div class="small" id="msgSmall"></div></div>
  <div id="feedback" class="chip"></div>

  <div id="chargeMeter" class="chip" hidden>
    <div class="charge-track"><div class="charge-fill" id="chargeFill"></div></div>
    <span class="charge-lbl" id="chargeLbl">POWER</span>
  </div>

  <div id="serveMeter" class="chip" hidden><div class="track"><div class="sweet"></div><div class="pin" id="servePin"></div></div></div>

  <div id="specBar" class="spec-bar chip" hidden aria-label="Spectator camera controls">
    <span class="spec-live"><i class="spec-dot"></i><span id="specCount">LIVE · 1 watching</span></span>
    <div class="spec-cams" role="group" aria-label="Camera angle">
      <button type="button" class="spec-btn" data-scam="umpire" aria-pressed="true">Umpire</button>
      <button type="button" class="spec-btn" data-scam="broadcast" aria-pressed="false">TV</button>
      <button type="button" class="spec-btn" data-scam="courtside" aria-pressed="false">Courtside</button>
      <button type="button" class="spec-btn" data-scam="follow" aria-pressed="false" id="specFollowBtn">Follow P1</button>
      <button type="button" class="spec-btn" data-scam="orbit" aria-pressed="false">Orbit</button>
    </div>
    <button type="button" class="spec-cheer" id="specCheerBtn" title="Send crowd cheer">👏 Cheer</button>
  </div>

  <div id="hint" class="chip" hidden></div>

  <div id="chatBubbles" aria-hidden="true">
    <div id="chatBubble0" class="chat-bubble team0" hidden></div>
    <div id="chatBubble1" class="chat-bubble team1" hidden></div>
    <div id="chatBubble2" class="chat-bubble team0" hidden></div>
    <div id="chatBubble3" class="chat-bubble team1" hidden></div>
  </div>

  <div id="chatHud" class="chat-hud" hidden>
    <div class="chat-hud-panel chip">
      <div class="chat-hud-head">
        <span id="chatHudTitle">Room Chat</span>
        <div class="chat-hud-actions">
          <button id="chatHudMute" class="chat-mute-btn" type="button" aria-pressed="false">Mute</button>
          <button id="chatHudClose" class="chat-close-btn" type="button" title="Close (Esc)">Esc</button>
        </div>
      </div>
      <div id="chatHudFeed" class="chat-hud-feed" aria-live="polite"></div>
      <div id="chatHudQuick" class="chat-hud-quick"></div>
      <div class="chat-hud-bar">
        <input id="chatHudInput" class="chat-input" type="text" maxlength="160" autocomplete="off" placeholder="Message room… (Enter to send)">
        <button id="chatHudSend" class="chat-send-btn" type="button">Send</button>
      </div>
    </div>
    <button id="chatHudToggle" class="chat-launcher chip" type="button" title="Open Room Chat (T or Enter)">
      <svg class="tico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span>Chat</span>
      <kbd>T</kbd>
      <span id="chatHudUnread" class="chat-unread" hidden>0</span>
    </button>
  </div>

  <div id="overlay" hidden>
    <div class="card chip" id="card"></div>
  </div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
